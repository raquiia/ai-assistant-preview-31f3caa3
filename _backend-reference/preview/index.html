<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIGSO-PCUBED AI Assistant - Local Preview</title>
    <style>
      :root {
        --navy: #061d3a;
        --navy-2: #0b2f5b;
        --blue: #2563eb;
        --cyan: #1db7e8;
        --bg: #f3f6fa;
        --surface: #ffffff;
        --surface-soft: #f8fbff;
        --line: #d8e2ee;
        --muted: #667085;
        --text: #111827;
        --ok: #12b76a;
        --warn: #f5a524;
        --danger: #e5484d;
        --radius: 8px;
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 12% 8%, rgba(29, 183, 232, 0.08), transparent 28%),
          linear-gradient(180deg, #f7faff 0%, var(--bg) 100%);
        color: var(--text);
        line-height: 1.45;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
        max-width: 100%;
      }

      button {
        cursor: pointer;
      }

      .login {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 460px;
      }

      .login-hero {
        background: linear-gradient(180deg, var(--navy), #09294f);
        color: white;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        background: white;
        color: var(--navy);
        font-weight: 800;
      }

      .login-hero h1 {
        max-width: 720px;
        margin: 0 0 24px;
        font-size: clamp(36px, 5vw, 58px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .hero-grid {
        display: grid;
        max-width: 720px;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .hero-card {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--radius);
        padding: 16px;
        background: rgba(255, 255, 255, 0.08);
      }

      .login-panel {
        display: grid;
        place-items: center;
        padding: 28px;
        background: white;
      }

      .login-box {
        width: 100%;
        max-width: 360px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: 0 12px 36px rgba(6, 29, 58, 0.08);
      }

      label {
        display: block;
        margin: 14px 0;
        font-size: 13px;
        color: #344054;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 11px 12px;
        outline: none;
        background: white;
        color: var(--text);
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(29, 183, 232, 0.14);
      }

      .primary {
        border: 0;
        border-radius: var(--radius);
        color: white;
        background: var(--blue);
        padding: 11px 14px;
        font-weight: 700;
      }

      .secondary {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: white;
        color: #344054;
        padding: 10px 12px;
        font-weight: 600;
      }

      .ghost {
        border: 0;
        background: transparent;
        color: inherit;
      }

      .hidden {
        display: none !important;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
      }

      .app.collapsed {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .sidebar {
        background: linear-gradient(180deg, #061d3a 0%, #08284f 100%);
        color: white;
        display: flex;
        flex-direction: column;
        box-shadow: 16px 0 42px rgba(6, 29, 58, 0.12);
        z-index: 2;
      }

      .sidebar .brand {
        padding: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .app.collapsed .brand {
        justify-content: center;
        padding: 16px 10px;
      }

      .app.collapsed .brand-text,
      .app.collapsed .nav-label,
      .app.collapsed .account-detail {
        display: none;
      }

      .nav-icon {
        width: 22px;
        height: 22px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        color: currentColor;
      }

      .nav-icon svg,
      .icon-btn svg,
      .secondary svg,
      .primary svg {
        width: 18px;
        height: 18px;
      }

      .nav {
        padding: 12px;
        flex: 1;
      }

      .nav button {
        width: 100%;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: #d8e6f5;
        padding: 0 12px;
        margin-bottom: 4px;
        text-align: left;
      }

      .app.collapsed .nav button {
        justify-content: center;
        padding: 0;
      }

      .nav button.active {
        background: white;
        color: var(--navy);
      }

      .account {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding: 16px;
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        min-height: 64px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 4;
      }

      .content {
        overflow: auto;
        height: calc(100vh - 64px);
        padding: 20px;
        min-width: 0;
      }

      .chat-grid {
        height: calc(100vh - 64px);
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 360px;
        min-width: 0;
        background: rgba(255, 255, 255, 0.52);
      }

      .panel {
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
        overflow: auto;
      }

      .panel-right {
        border-left: 1px solid var(--line);
        background: #f6f9fd;
        overflow: auto;
      }

      .panel-head {
        min-height: 56px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: rgba(255, 255, 255, 0.92);
        gap: 12px;
      }

      .conversation {
        width: calc(100% - 20px);
        margin: 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px;
        text-align: left;
        overflow-wrap: anywhere;
        transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .conversation.active {
        border-color: var(--blue);
        background: #eff6ff;
        box-shadow: 0 10px 26px rgba(37, 99, 235, 0.12);
      }

      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .chat-toolbar {
        display: none;
        gap: 8px;
        padding: 12px 14px 0;
      }

      .chat-mobile-toggle {
        display: none;
      }

      .chat-mobile-panels {
        display: none;
      }

      .chat-toolbar button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-weight: 700;
        color: #344054;
      }

      .chat-toolbar button.active {
        border-color: var(--blue);
        color: var(--blue);
        background: #eff6ff;
      }

      .chat-workspace {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        min-height: 0;
      }

      .chat-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .chat-insights {
        border-left: 1px solid var(--line);
        background: #f6f9fd;
        overflow: auto;
      }

      .chat-section {
        display: block;
      }

      .chat-section.hidden {
        display: none;
      }

      .messages {
        flex: 1;
        overflow: auto;
        padding: 22px;
        min-width: 0;
      }

      .bubble {
        max-width: 78%;
        border-radius: var(--radius);
        padding: 14px 16px;
        margin: 12px 0;
        line-height: 1.55;
        font-size: 14px;
        white-space: pre-line;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .bubble.user {
        margin-left: auto;
        background: var(--blue);
        color: white;
      }

      .bubble.assistant {
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 10px 28px rgba(6, 29, 58, 0.06);
      }

      .composer {
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        padding: 14px;
      }

      .composer-row {
        display: grid;
        grid-template-columns: 1fr 44px 44px;
        gap: 8px;
        align-items: end;
      }

      .theme-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: white;
        display: grid;
        place-items: center;
        color: var(--navy);
      }

      .icon-btn.primary-tone {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: var(--blue);
      }

      .icon-btn.warn-tone {
        background: #fffaeb;
        border-color: #fedf89;
        color: #b54708;
      }

      .icon-btn.bad-tone {
        background: #fef3f2;
        border-color: #fecdca;
        color: #b42318;
      }

      .source-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
        background: var(--surface);
        margin-bottom: 12px;
        overflow-wrap: anywhere;
      }

      .source-score {
        height: 8px;
        border-radius: 99px;
        background: #e6edf4;
        overflow: hidden;
        margin: 10px 0 8px;
      }

      .source-score span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
      }

      .source-card button {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        color: var(--blue);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .kpi,
      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.94);
        padding: 16px;
        box-shadow: 0 14px 34px rgba(6, 29, 58, 0.06);
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .card > .card {
        background: var(--surface-soft);
        box-shadow: none;
      }

      .kpi strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(360px, 0.8fr);
        gap: 16px;
        min-width: 0;
      }

      .dashboard-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
        gap: 16px;
        margin-bottom: 16px;
        min-width: 0;
      }

      .dashboard-command {
        background:
          linear-gradient(135deg, rgba(6, 29, 58, 0.96), rgba(11, 47, 91, 0.96)),
          var(--navy);
        color: white;
        border-color: rgba(255, 255, 255, 0.14);
      }

      .dashboard-command .muted {
        color: #bfdbfe;
      }

      .dashboard-command .metric-card {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.16);
        color: white;
      }

      .dashboard-command .metric-card .muted {
        color: #b7d6f8;
      }

      .dashboard-hero .card {
        min-height: 100%;
      }

      .dashboard-secondary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
        min-width: 0;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) 70px;
        align-items: center;
        gap: 10px;
        margin: 12px 0;
        font-size: 13px;
        min-width: 0;
      }

      .bar-row span {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .bar {
        height: 10px;
        border-radius: 99px;
        background: #edf2f7;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
        min-width: 0;
      }

      .tabs button {
        border: 1px solid var(--line);
        background: white;
        border-radius: var(--radius);
        padding: 9px 11px;
        font-weight: 700;
        color: #344054;
      }

      .tabs button.active {
        border-color: var(--blue);
        color: var(--blue);
        background: #eff6ff;
      }

      .toggle-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toggle-row button,
      .chip-button {
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
        color: #344054;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-row button.active,
      .chip-button.active {
        border-color: var(--blue);
        background: #eff6ff;
        color: var(--blue);
      }

      .mini-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
        background: #eef2f6;
        color: #344054;
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .timeline-item {
        border: 1px solid var(--line);
        background: white;
        border-radius: var(--radius);
        padding: 12px;
      }

      .prompt-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
        gap: 16px;
        min-width: 0;
      }

      .prompt-stack {
        display: grid;
        gap: 12px;
      }

      .prompt-section {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.94);
        padding: 14px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .switch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
        background: #fff;
      }

      .switch input {
        width: 18px;
        height: 18px;
        accent-color: var(--blue);
      }

      .status {
        display: inline-flex;
        align-items: center;
        border-radius: 99px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
        background: #eef2f6;
      }

      .status.ok {
        background: #ecfdf3;
        color: #027a48;
      }

      .status.warn {
        background: #fffaeb;
        color: #b54708;
      }

      .status.bad {
        background: #fef3f2;
        color: #b42318;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid #edf2f7;
        padding: 12px;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
        overflow-wrap: anywhere;
        word-break: break-word;
        white-space: normal;
      }

      th {
        background: #f8fafc;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 16px;
        min-width: 0;
      }

      .drawer {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(560px, 100vw);
        background: white;
        border-left: 1px solid var(--line);
        box-shadow: 0 18px 48px rgba(6, 29, 58, 0.18);
        z-index: 20;
        overflow: auto;
      }

      .table-scroll {
        width: 100%;
        overflow-x: auto;
        border-radius: var(--radius);
      }

      .drawer-head {
        height: 64px;
        border-bottom: 1px solid var(--line);
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .drawer-body {
        padding: 18px;
      }

      .highlight {
        background: #ecfeff;
        border: 1px solid #a5f3fc;
        border-radius: var(--radius);
        padding: 16px;
        line-height: 1.7;
      }

      .behavior-panel {
        display: grid;
        gap: 10px;
      }

      .behavior-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .metric-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        min-width: 0;
      }

      .metric-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: white;
        padding: 14px;
      }

      .metric-card strong {
        display: block;
        margin-top: 8px;
        font-size: 24px;
      }

      .signal-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        min-width: 0;
      }

      .mobile-nav-select {
        display: none;
      }

      .signal-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: white;
        padding: 14px;
      }

      .tag {
        display: inline-block;
        border-radius: 999px;
        background: #eef2f6;
        padding: 4px 8px;
        font-size: 12px;
        color: #344054;
        margin: 0 6px 6px 0;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: var(--navy);
        color: white;
        padding: 12px 14px;
        border-radius: var(--radius);
        box-shadow: 0 18px 48px rgba(6, 29, 58, 0.18);
      }

      @media (max-width: 1100px) {
        .login,
        .app,
        .chat-grid,
        .split {
          grid-template-columns: 1fr;
        }

        .sidebar,
        .panel,
        .panel-right {
          display: none;
        }

        .chat-toolbar {
          display: flex;
          position: sticky;
          top: 0;
          z-index: 5;
          background: white;
          border-bottom: 1px solid var(--line);
        }

        .chat-grid {
          height: calc(100vh - 64px);
          overflow: auto;
        }

        .chat-mobile-panels {
          display: grid;
          gap: 12px;
          padding: 12px 14px 0;
        }

        .chat-mobile-toggle {
          display: inline-grid;
        }

        .chat-workspace {
          display: block;
        }

        .chat-insights {
          border-left: 0;
          border-top: 1px solid var(--line);
        }

        .chat-section.hidden {
          display: none;
        }

        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .dashboard-grid,
        .theme-row,
        .prompt-grid,
        .field-grid {
          grid-template-columns: 1fr;
        }

        .dashboard-hero,
        .dashboard-secondary {
          grid-template-columns: 1fr;
        }

        .mobile-nav-select {
          display: block;
          width: min(220px, 45vw);
        }

        .topbar {
          padding: 0 12px;
          gap: 10px;
        }

        .topbar > div {
          min-width: 0;
        }

        .content {
          padding: 12px;
        }

        .messages {
          padding: 14px;
        }

        .bubble {
          max-width: 100%;
          font-size: 13px;
          margin: 10px 0;
        }

        .composer {
          padding: 12px;
        }

        .bar-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
        }

        .metric-strip,
        .signal-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        table {
          min-width: 720px;
        }
      }

      @media (max-width: 720px) {
        .kpi-grid,
        .metric-strip,
        .signal-grid {
          grid-template-columns: 1fr;
        }

        .chat-toolbar button {
          padding: 8px 10px;
          font-size: 12px;
        }

        th,
        td {
          padding: 9px 8px;
          font-size: 12px;
        }

        .login-hero {
          padding: 28px;
        }

        .hero-grid {
          grid-template-columns: 1fr;
        }

        .composer-row {
          grid-template-columns: minmax(0, 1fr) 40px 40px;
        }

        .theme-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>

        return conversation.userId === user.id;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
      }

      function toast(message) {
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = message;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }

      function tokenScore(query, text) {
        const tokens = query.toLowerCase().split(/[^a-z0-9]+/).filter((t) => t.length > 2);
        if (!tokens.length) return 0;
        const lower = text.toLowerCase();
        return Math.round((tokens.filter((token) => lower.includes(token)).length / tokens.length) * 100);
      }

      function retrieve(query) {
        const industry = state.chatFilters?.industry || "";
        const domain = state.chatFilters?.domain || "";
        return state.chunks
          .map((chunk) => {
            const tags = chunk.tags || [];
            const themeBoost = (industry && tags.includes(industry) ? 14 : 0) + (domain && tags.includes(domain) ? 18 : 0);
            return { ...chunk, score: Math.min(100, Math.max(chunk.score || 0, tokenScore(query, chunk.text)) + themeBoost) };
          })
          .filter((chunk) => chunk.score >= Math.max(35, Number(state.settings?.minRelevanceScore || 55) - 20))
          .sort((a, b) => b.score - a.score)
          .slice(0, Number(state.settings?.topK || 5));
      }

        const response = {
          id: "resp-" + crypto.randomUUID(),
          messageId: message.id,
          provider: "local",
          model: "local-grounded-preview",
          content,
          confidence: escalated ? 35 : Math.round(sources.reduce((sum, s) => sum + s.score, 0) / sources.length),

          escalationTriggered: escalated,
          sources: sources.map((s) => s.id),
          inputTokens: 520 + query.length * 2 + sources.length * 180,

          estimatedCost: 0,
          industry: state.chatFilters?.industry || null,
          domain: state.chatFilters?.domain || null,
          createdAt: now()

        state.responses.push(response);
        state.messages.push({ id: "msg-" + crypto.randomUUID(), conversationId: conversation.id, role: "assistant", content, language: user.language || "fr", createdAt: now() });

        render();
      }

      function sourceCard(chunk) {
        return `<div class="source-card">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">

          <p>${escapeHtml(chunk.text.slice(0, 260))}${chunk.text.length > 260 ? "..." : ""}</p>
        </div>`;
      }

      function addFeedback(responseId, rating) {
        const entry = { id: "fb-" + crypto.randomUUID(), responseId, userId: currentUser().id, rating, createdAt: now() };
        state.feedback.push(entry);
        state.behaviorTimeline.unshift({
          id: "beh-" + crypto.randomUUID(),
          kind: "Feedback",
          title: rating === "DOWN" ? "Retour negatif sur une reponse" : "Retour positif sur une reponse",
          detail: rating === "DOWN" ? "Le manager ou consultant a signale une reponse a revoir. Une regeneration fallback reste disponible et la comparaison est conservee." : "La reponse a ete notee positivement et conservee comme reference comportementale.",
          createdAt: entry.createdAt,
          status: rating === "DOWN" ? "REVIEW" : "ACTIVE"
        });
        persist();
        toast(rating === "DOWN" ? "Feedback negatif logue. Retry fallback disponible." : "Merci pour le feedback.");
      }

      function retryFallback(responseId) {
        const response = state.responses.find((r) => r.id === responseId);
        if (!response) return;
        const copy = { ...response, id: "resp-" + crypto.randomUUID(), model: "gpt-5.5", provider: "openai", fallbackUsed: true, comparisonId: "cmp-" + crypto.randomUUID(), createdAt: now(), content: response.content + "\n\nVersion fallback GPT-5.5: meme sources, formulation plus prudente et auditable." };
        state.responses.push(copy);
        state.behaviorTimeline.unshift({ id: "beh-" + crypto.randomUUID(), kind: "Fallback", title: "Reponse regeneree par GPT-5.5", detail: "Comparaison conservee apres signalement negatif ou confiance trop basse.", createdAt: copy.createdAt, status: "ACTIVE" });
        const originalMessage = state.messages.find((m) => m.id === response.messageId);
        state.messages.push({ id: "msg-" + crypto.randomUUID(), conversationId: originalMessage.conversationId, role: "assistant", content: copy.content, language: originalMessage.language, createdAt: now() });
        persist();
        render();
      }

      function consultantRowsFor(managerId) {
        return users.filter((user) => user.role === "CONSULTANT" && (!managerId || user.managerId === managerId)).map((consultant) => {
          const conversations = state.conversations.filter((conversation) => conversation.userId === consultant.id);
          const messageIds = state.messages.filter((message) => conversations.some((conversation) => conversation.id === message.conversationId)).map((message) => message.id);
          const responses = state.responses.filter((response) => messageIds.includes(response.messageId));
          const feedback = state.feedback.filter((item) => responses.some((response) => response.id === item.responseId));
          return {
            consultant,
            conversations,
            responses,
            feedback,
            tokens: responses.reduce((sum, response) => sum + (response.inputTokens || 0) + (response.outputTokens || 0), 0),
            lastActivity: responses.at(-1)?.createdAt || conversations.at(-1)?.updatedAt || consultant.createdAt || now()
          };
        });
      }

      function decideRequest(requestId, status) {
        const request = state.managerRequests.find((item) => item.id === requestId);
        const candidate = request ? users.find((item) => item.id === request.userId) : null;
        if (!request || !candidate) return;
        request.status = status;
        request.decidedAt = now();
        request.decidedBy = currentUser().id;
        if (status === "APPROVED") {
          candidate.managerId = request.managerId;
          candidate.status = "ACTIVE";
          candidate.department = users.find((item) => item.id === request.managerId)?.department || candidate.department;
          const created = state.createdUsers.find((item) => item.id === candidate.id);
          if (created) Object.assign(created, candidate);
        }
        state.audit.unshift({ id: "audit-" + crypto.randomUUID(), action: `MANAGER_REQUEST_${status}`, actorId: currentUser().id, entityType: "ManagerRequest", entityId: requestId, createdAt: now(), metadata: { userId: candidate.id } });
        persist();
        render();
      }

      function renderHistory() {

              const entry = correction || { id: "kc-" + crypto.randomUUID(), responseId: row.response.id, title: "Knowledge Correction", content: text, tags: ["Approved Guidance", "Knowledge Corrections"], status: "DRAFT", createdAt: now(), createdById: user.id };

              entry.status = status;
              entry.updatedAt = now();
              if (!state.knowledgeCorrections.some((item) => item.id === entry.id)) state.knowledgeCorrections.unshift(entry);

              state.behaviorTimeline.unshift({ id: "beh-" + crypto.randomUUID(), kind: "Correction", title: status === "ACTIVE" ? "Guidance activée" : status === "APPROVED" ? "Guidance approuvée" : "Brouillon mis à jour", detail: text.slice(0, 180), createdAt: now(), status });

                <label>Max tokens<input id="setting-max" type="number" value="${state.settings.maxTokens}" /></label>
                <label>Temperature<input id="setting-temp" type="number" step="0.1" value="${state.settings.temperature}" /></label>
                <label>SearchProvider<select id="setting-search"><option value="mock">mock</option><option value="openai_hosted">openai_hosted</option><option value="tavily">tavily</option><option value="serpapi">serpapi</option><option value="none">none</option></select></label>
              </div>
              <label style="margin-top:12px">Allowed embed origins<input id="setting-origins" value="${escapeHtml(state.settings.allowedOrigins)}" /></label>
              <div class="toggle-row" style="margin-top:12px">
                <button class="chip-button" data-presets="professional">Professionnel</button>
                <button class="chip-button" data-presets="concise">Concis</button>
                <button class="chip-button" data-presets="cautious">Prudent</button>
              </div>
              <button class="primary" id="save-settings" style="margin-top:12px"><span class="nav-icon">${icon("spark")}</span>Sauvegarder les parametres</button>
            </div>
            <div class="prompt-section">
              <strong>ApiKeyManager</strong>
              <label>Provider<select id="provider"><option>mistral</option><option>openai</option><option>search</option></select></label>
              <label>Modele<input id="model" value="gpt-5.5" /></label>
              <label>Cle API<input id="key" type="password" /></label>
              <button class="primary" id="save-key"><span class="nav-icon">${icon("review")}</span>Sauvegarder masque</button>
              <hr />
              <table><thead><tr><th>Provider</th><th>Modele</th><th>Cle</th><th>Actif</th></tr></thead><tbody>${state.providers.map((p) => `<tr><td>${p.provider}</td><td>${p.model}</td><td>${p.maskedKey || "Non configuree"}</td><td><span class="status ${p.active ? "ok" : "bad"}">${p.active ? "Oui" : "Non"}</span></td></tr>`).join("")}</tbody></table>
            </div>
          </div>
        </section>`);
        document.getElementById("setting-search").value = state.settings.searchProvider;
        document.getElementById("save-prompt").onclick = () => {
          const config = {
            webSearchEnabled: !!document.getElementById("cfg-websearch").checked,
            tone: document.getElementById("cfg-tone").value,
            conduct: document.getElementById("cfg-conduct").value,
            answerFormat: document.getElementById("cfg-format").value,
            escalation: document.getElementById("cfg-escalation").value,
            languagePolicy: document.getElementById("cfg-language").value,
            sourcePolicy: document.getElementById("cfg-sources").value
          };
          state.prompt = document.getElementById("prompt-text").value;
          state.promptVersions.push({ id: "prv-" + crypto.randomUUID(), name: `Version ${state.promptVersions.length + 1}`, content: state.prompt, config, active: true, createdAt: now() });
          state.promptVersions.forEach((version, index) => { version.active = index === state.promptVersions.length - 1; });
          state.behaviorTimeline.unshift({ id: "beh-" + crypto.randomUUID(), kind: "Prompt", title: "Prompt mis a jour", detail: `${config.tone || "professionnel"} - websearch ${config.webSearchEnabled ? "active" : "inactif"}.`, createdAt: now(), status: "ACTIVE" });
          persist();
          toast("Nouvelle version active.");
          render();
        };
        document.querySelectorAll("[data-presets]").forEach((button) => {
          button.onclick = () => {
            const preset = button.dataset.presets;
            const mapping = {
              professional: { tone: "professionnel", answerFormat: "Resume, recommandations, sources" },
              concise: { tone: "concis", answerFormat: "Bref resume, points actionnables, sources" },
              cautious: { tone: "prudent", answerFormat: "Resume, limites, sources, escalation si besoin" }
            }[preset];
            document.getElementById("cfg-tone").value = mapping.tone;
            document.getElementById("cfg-format").value = mapping.answerFormat;
          };
        });
        document.getElementById("save-settings").onclick = () => {
          state.settings.topK = Number(document.getElementById("setting-topk").value) || 5;
          state.settings.minRelevanceScore = Number(document.getElementById("setting-score").value) || 55;
          state.settings.qualityThreshold = Number(document.getElementById("setting-quality").value) || 70;
          state.settings.maxTokens = Number(document.getElementById("setting-max").value) || 1200;
          state.settings.temperature = Number(document.getElementById("setting-temp").value) || 0.2;
          state.settings.searchProvider = document.getElementById("setting-search").value;
          state.settings.allowedOrigins = document.getElementById("setting-origins").value;
          state.audit.unshift({ id: "audit-" + crypto.randomUUID(), action: "SETTINGS_CHANGED", actorId: currentUser().id, entityType: "Settings", createdAt: now(), metadata: { ...state.settings } });
          state.behaviorTimeline.unshift({ id: "beh-" + crypto.randomUUID(), kind: "Settings", title: "Parametres IA sauvegardes", detail: `TopK ${state.settings.topK}, seuil ${state.settings.minRelevanceScore}, websearch ${state.settings.searchProvider}.`, createdAt: now(), status: "ACTIVE" });
          persist();
          toast("Parametres sauvegardes.");
        };
        document.getElementById("save-key").onclick = () => {
          const key = document.getElementById("key").value;
          state.providers.push({ id: "provider-" + crypto.randomUUID(), provider: document.getElementById("provider").value, model: document.getElementById("model").value, active: true, maskedKey: key ? key.slice(0, 4) + "..." + key.slice(-4) : null });
          state.behaviorTimeline.unshift({ id: "beh-" + crypto.randomUUID(), kind: "Secrets", title: "Cle API enregistree", detail: `Provider ${document.getElementById("provider").value} mis a jour avec cle masquee.`, createdAt: now(), status: "ACTIVE" });
          persist();
          render();
        };
      }
      function renderAudit() {
        renderShell(`<section class="content split">
          <div>
            <div class="card" style="margin-bottom:16px">
              <strong>AI System Card</strong>
              <p>Finalite: assistant interne MIGSO-PCUBED pour consultants PMO et Project Controls.</p>
              <p>Controles: RBAC, sources obligatoires, escalation humaine, logs d'audit, masquage des secrets, review KB super-admin, registry de prompts et corrections approuvees.</p>
            </div>
            <div class="card" style="margin-bottom:16px">
              <strong>Registry de changement</strong>
              <div class="timeline" style="margin-top:12px">
                ${(state.behaviorTimeline || []).slice(0, 8).map((item) => `<div class="timeline-item"><div class="behavior-row"><strong>${escapeHtml(item.title)}</strong><span class="mini-pill">${escapeHtml(item.kind)}</span></div><p class="muted">${escapeHtml(item.detail)}</p><p class="muted">${new Date(item.createdAt).toLocaleString()}</p></div>`).join("") || `<p class="muted">Aucun changement enregistré.</p>`}
              </div>
            </div>
            <table><thead><tr><th>Date</th><th>Action</th><th>Acteur</th><th>Entite</th><th>Metadata</th></tr></thead><tbody>
              ${state.audit.map((a) => `<tr><td>${new Date(a.createdAt).toLocaleString()}</td><td>${a.action}</td><td>${a.actorId || ""}</td><td>${a.entityType}</td><td><code>${escapeHtml(JSON.stringify(a.metadata || {}))}</code></td></tr>`).join("")}
            </tbody></table>
          </div>
          <aside class="card">
            <strong>Registre prompt</strong>
            <div class="timeline" style="margin-top:12px">
              ${state.promptVersions.slice().reverse().map((version) => `<div class="timeline-item"><div class="behavior-row"><strong>${escapeHtml(version.name)}</strong><span class="mini-pill">${version.active ? "ACTIVE" : "ARCHIVE"}</span></div><p class="muted">${escapeHtml(version.config?.tone || "professionnel")} - websearch ${version.config?.webSearchEnabled ? "on" : "off"}</p></div>`).join("") || `<p class="muted">Aucune version de prompt.</p>`}
            </div>
          </aside>
        </section>`);
      }

      function renderEmbed() {
        const snippet = `<iframe src="http://127.0.0.1:5173/embed/chat?tenant=mp&theme=default" title="MIGSO-PCUBED AI Assistant" style="width:420px;height:640px;border:0;border-radius:8px"></iframe>`;
        renderShell(`<section class="content split">
          <div class="card"><strong>Snippet iframe</strong><pre style="white-space:pre-wrap;background:#111827;color:white;padding:14px;border-radius:8px">${escapeHtml(snippet)}</pre><button class="primary" id="copy-snippet">Copier</button></div>
          <div class="card"><strong>Preview iframe</strong><div style="border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:12px">MIGSO-PCUBED AI Assistant embed ready</div></div>
        </section>`);
        document.getElementById("copy-snippet").onclick = () => navigator.clipboard.writeText(snippet).then(() => toast("Snippet copie"));
      }

      function bindSourceButtons() {
        document.querySelectorAll("[data-source]").forEach((button) => {
          button.onclick = () => openSource(button.dataset.source);
        });
      }

      function openSource(id) {
        const chunk = state.chunks.find((c) => c.id === id);
        if (!chunk) return;
        const drawer = document.createElement("aside");
        drawer.className = "drawer";
        drawer.innerHTML = `<div class="drawer-head"><div><strong>${escapeHtml(chunk.title)}</strong><br /><span class="muted">${escapeHtml(chunk.section)} - Page ${chunk.page}</span></div><button class="icon-btn" id="close-drawer" aria-label="Fermer">${icon("close")}</button></div><div class="drawer-body"><div>${(chunk.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div><p class="highlight">${escapeHtml(chunk.text)}</p></div>`;
        document.body.appendChild(drawer);
        document.getElementById("close-drawer").onclick = () => drawer.remove();
      }

      function render() {
        if (!state.session) return renderLogin();
        if (state.view === "chat") return renderChat();
        if (state.view === "team") return renderTeam();
        if (state.view === "history") return renderHistory();
        if (state.view === "dashboard") return renderDashboard();
        if (state.view === "kb") return renderKb();
        if (state.view === "users") return renderUsers();
        if (state.view === "prompts") return renderPrompts();
        if (state.view === "audit") return renderAudit();
        if (state.view === "embed") return renderEmbed();
        return renderChat();
      }

      render();
    </script>
  </body>
</html>
