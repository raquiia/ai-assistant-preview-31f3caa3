services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mp_user
      POSTGRES_PASSWORD: mp_password
      POSTGRES_DB: mp_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp_user -d mp_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: local-admin-Password1!
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.example
    environment:
      API_PORT: 4000
      APP_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://mp_user:mp_password@postgres:5432/mp_assistant?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      opensearch:
        condition: service_started
    volumes:
      - .:/app
      - worker-node-modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

volumes:
  postgres-data:
  opensearch-data:
  minio-data:
  api-node-modules:
  worker-node-modules:
  web-node-modules:
