name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: "Run terraform apply (infra changes)"
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-3
  PROJECT_NAME: migso-pcubed
  ENVIRONMENT: prod
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push Docker images to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, worker]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/${{ matrix.service }}
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$REPO" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "ECR repository already exists: $REPO"
          else
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "${{ env.AWS_REGION }}" >/dev/null
            echo "Created ECR repository: $REPO"
          fi

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"
          LATEST="$REGISTRY/$REPO:latest"
          docker build \
            -t "$IMAGE" -t "$LATEST" \
            -f _backend-reference/apps/${{ matrix.service }}/Dockerfile \
            _backend-reference
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "Pushed $IMAGE"

  # ---------------------------------------------------------------------------
  # 2. Terraform apply — updates ECS task defs with the new image tags
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _backend-reference/infra/aws
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=${PROJECT_NAME}-tfstate-${ACCOUNT_ID}" \
            -backend-config="dynamodb_table=${PROJECT_NAME}-tfstate-lock"

      - name: Check Terraform state lock
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT_NAME}-tfstate-${ACCOUNT_ID}"
          TABLE="${PROJECT_NAME}-tfstate-lock"
          LOCK_ID="${BUCKET}/${PROJECT_NAME}/terraform.tfstate"
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name "$TABLE" \
            --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
            --projection-expression "Info" \
            --query "Item.Info.S" \
            --output text 2>/dev/null || true)
          if [[ -n "$LOCK_INFO" && "$LOCK_INFO" != "None" ]]; then
            echo "::error title=Terraform state is locked::Cancel older AWS deploy runs. If no run is active, this is a stale lock and must be force-unlocked with the ID shown below."
            echo "$LOCK_INFO"
            exit 1
          fi

      - name: Terraform Plan
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          terraform plan \
            -lock-timeout=10m \
            -var="api_image_tag=$TAG" \
            -var="web_image_tag=$TAG" \
            -var="worker_image_tag=$TAG" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # 3. Force ECS to pull the new image (no-op if task-def already changed)
  # ---------------------------------------------------------------------------
  ecs-deploy:
    name: ECS Rolling Update
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }} \
            --service ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${{ matrix.service }} \
            --force-new-deployment \
            --no-cli-pager
