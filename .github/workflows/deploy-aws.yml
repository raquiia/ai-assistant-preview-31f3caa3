name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: "Run terraform apply (infra changes)"
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-3
  PROJECT_NAME: migso-pcubed
  ENVIRONMENT: prod
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push Docker images to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, worker]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/${{ matrix.service }}
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$REPO" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "ECR repository already exists: $REPO"
          else
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "${{ env.AWS_REGION }}" >/dev/null
            echo "Created ECR repository: $REPO"
          fi

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"
          LATEST="$REGISTRY/$REPO:latest"
          docker build \
            -t "$IMAGE" -t "$LATEST" \
            -f _backend-reference/apps/${{ matrix.service }}/Dockerfile \
            _backend-reference
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "Pushed $IMAGE"

  # ---------------------------------------------------------------------------
  # 2. Terraform apply — updates ECS task defs with the new image tags
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _backend-reference/infra/aws
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=${PROJECT_NAME}-tfstate-${ACCOUNT_ID}" \
            -backend-config="dynamodb_table=${PROJECT_NAME}-tfstate-lock"

      - name: Auto-release stale Terraform lock
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT_NAME}-tfstate-${ACCOUNT_ID}"
          TABLE="${PROJECT_NAME}-tfstate-lock"
          LOCK_ID="${BUCKET}/${PROJECT_NAME}/terraform.tfstate"
          while true; do
            ITEM=$(aws dynamodb get-item \
              --table-name "$TABLE" \
              --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
              --output json 2>/dev/null || echo '{}')
            INFO=$(echo "$ITEM" | jq -r '.Item.Info.S // empty')
            if [[ -z "$INFO" ]]; then
              echo "No active lock found."
              exit 0
            fi
            echo "Found existing lock:"
            echo "$INFO"
            CREATED=$(echo "$INFO" | jq -r '.Created // empty')
            if [[ -z "$CREATED" ]]; then
              echo "Lock has no Created timestamp; deleting as stale."
              aws dynamodb delete-item --table-name "$TABLE" \
                --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}"
              exit 0
            fi
            LOCK_EPOCH=$(date -d "$CREATED" +%s)
            NOW_EPOCH=$(date +%s)
            AGE=$(( NOW_EPOCH - LOCK_EPOCH ))
            echo "Lock age: ${AGE}s"
            if (( AGE > 900 )); then
              echo "Lock older than 15min — force-releasing."
              aws dynamodb delete-item --table-name "$TABLE" \
                --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}"
              exit 0
            fi
            WAIT=$(( 900 - AGE ))
            if (( WAIT > 60 )); then WAIT=60; fi
            echo "Recent lock still present; waiting ${WAIT}s before rechecking."
            sleep "$WAIT"
          done

      - name: Terraform Plan
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_alarm_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=10m \
            -var="api_image_tag=$TAG" \
            -var="web_image_tag=$TAG" \
            -var="worker_image_tag=$TAG" \
            -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_alarm_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform apply -input=false -lock-timeout=10m -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # 3. Force ECS to pull the new image (no-op if task-def already changed)
  # ---------------------------------------------------------------------------
  ecs-deploy:
    name: ECS Rolling Update
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }} \
            --service ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${{ matrix.service }} \
            --force-new-deployment \
            --no-cli-pager
