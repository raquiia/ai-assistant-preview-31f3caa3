name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: "Run terraform apply (infra changes)"
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-3
  PROJECT_NAME: migso-pcubed
  ENVIRONMENT: prod
  TF_VERSION: 1.9.8

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push Docker images to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, worker]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"
          LATEST="$REGISTRY/$REPO:latest"
          docker build \
            -t "$IMAGE" -t "$LATEST" \
            -f _backend-reference/apps/${{ matrix.service }}/Dockerfile \
            _backend-reference
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "Pushed $IMAGE"

  # ---------------------------------------------------------------------------
  # 2. Terraform apply — updates ECS task defs with the new image tags
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _backend-reference/infra/aws
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          terraform plan \
            -var="api_image_tag=$TAG" \
            -var="web_image_tag=$TAG" \
            -var="worker_image_tag=$TAG" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # 3. Force ECS to pull the new image (no-op if task-def already changed)
  # ---------------------------------------------------------------------------
  ecs-deploy:
    name: ECS Rolling Update
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }} \
            --service ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${{ matrix.service }} \
            --force-new-deployment \
            --no-cli-pager
